<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-label="GEMM throughput by kernel at 4096 cubed">
  <title>GEMM throughput by kernel at 4096 cubed</title>

  <style>
    .surface { fill: #fcfcfb; }
    .t-pri   { fill: #0b0b0b; }
    .t-sec   { fill: #52514e; }
    .t-mut   { fill: #78766f; }
    .grid    { stroke: #e3e2dd; stroke-width: 1; }
    .axis    { stroke: #c9c7c0; stroke-width: 1; }
    .roof    { stroke: #9a9890; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .ref     { fill: #9a9890; }
    .accent  { fill: #2a78d6; }
    .accent-s{ stroke: #2a78d6; }
    .s0 { fill: #2a78d6; }  .s0-s { stroke: #2a78d6; }
    .s1 { fill: #eb6834; }  .s1-s { stroke: #eb6834; }
    .s2 { fill: #1baf7a; }  .s2-s { stroke: #1baf7a; }
    .s3 { fill: #eda100; }  .s3-s { stroke: #eda100; }
    .s4 { fill: #e87ba4; }  .s4-s { stroke: #e87ba4; }
    .s5 { fill: #008300; }  .s5-s { stroke: #008300; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-pri   { fill: #ffffff; }
      .t-sec   { fill: #c3c2b7; }
      .t-mut   { fill: #98968c; }
      .grid    { stroke: #2f2f2d; }
      .axis    { stroke: #4a4a46; }
      .roof    { stroke: #7c7a73; }
      .ref     { fill: #7c7a73; }
      .accent  { fill: #3987e5; }
      .accent-s{ stroke: #3987e5; }
      .s0 { fill: #3987e5; }  .s0-s { stroke: #3987e5; }
      .s1 { fill: #d95926; }  .s1-s { stroke: #d95926; }
      .s2 { fill: #199e70; }  .s2-s { stroke: #199e70; }
      .s3 { fill: #c98500; }  .s3-s { stroke: #c98500; }
      .s4 { fill: #d55181; }  .s4-s { stroke: #d55181; }
      .s5 { fill: #008300; }  .s5-s { stroke: #008300; }
    }
  </style>
  <rect class="surface" x="0" y="0" width="760" height="372" rx="6"/>
  <text class="t-pri" x="20" y="26" font-size="15" font-weight="600">GEMM throughput at 4096³ · single run, all bars comparable</text>
  <text class="t-sec" x="20" y="44" font-size="12">RTX 3050 Laptop · measured FP32 ceiling 6884 GFLOPS · higher is better</text>
  <text class="t-sec" x="168" y="75.0" font-size="12" text-anchor="end">shared tiled</text>
  <rect class="accent" x="178" y="56" width="25.5" height="30" rx="4"/>
  <text class="t-pri" x="211.5" y="75.0" font-size="12" font-weight="600">430</text>
  <text class="t-sec" x="168" y="117.0" font-size="12" text-anchor="end">naive</text>
  <rect class="accent" x="178" y="98" width="27.7" height="30" rx="4"/>
  <text class="t-pri" x="213.7" y="117.0" font-size="12" font-weight="600">466</text>
  <text class="t-sec" x="168" y="159.0" font-size="12" text-anchor="end">register 8x8</text>
  <rect class="accent" x="178" y="140" width="135.6" height="30" rx="4"/>
  <text class="t-pri" x="321.6" y="159.0" font-size="12" font-weight="600">2,285</text>
  <text class="t-sec" x="168" y="201.0" font-size="12" text-anchor="end">+ float4</text>
  <rect class="accent" x="178" y="182" width="221.1" height="30" rx="4"/>
  <text class="t-pri" x="407.1" y="201.0" font-size="12" font-weight="600">3,727</text>
  <text class="t-sec" x="168" y="243.0" font-size="12" text-anchor="end">cuBLAS — strict FP32</text>
  <rect class="ref" x="178" y="224" width="250.1" height="30" rx="4"/>
  <text class="t-pri" x="436.1" y="243.0" font-size="12" font-weight="500">4,216</text>
  <text class="t-sec" x="168" y="285.0" font-size="12" text-anchor="end">tuned (BK=16)</text>
  <rect class="accent" x="178" y="266" width="262.5" height="30" rx="4"/>
  <text class="t-pri" x="448.5" y="285.0" font-size="12" font-weight="600">4,424</text>
  <text class="t-sec" x="168" y="327.0" font-size="12" text-anchor="end">cuBLAS — TF32 tensor</text>
  <rect class="ref" x="178" y="308" width="458.5" height="30" rx="4" fill-opacity="0.45"/>
  <rect class="ref" x="178" y="308" width="458.5" height="30" rx="4" fill="none" stroke="#9a9890" stroke-width="2"/>
  <text class="t-pri" x="644.5" y="327.0" font-size="12" font-weight="500">7,728</text>
  <line class="axis" x1="178" y1="48" x2="178" y2="342"/>
  <text class="t-mut" x="178" y="365" font-size="11">GFLOPS</text>
  <text class="t-mut" x="740" y="365" font-size="11" text-anchor="end">blue = this project · grey = cuBLAS</text>
</svg>
