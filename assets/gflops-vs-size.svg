<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="GEMM throughput versus matrix size">
  <title>GEMM throughput versus matrix size</title>

  <style>
    .surface { fill: #fcfcfb; }
    .t-pri   { fill: #0b0b0b; }
    .t-sec   { fill: #52514e; }
    .t-mut   { fill: #78766f; }
    .grid    { stroke: #e3e2dd; stroke-width: 1; }
    .axis    { stroke: #c9c7c0; stroke-width: 1; }
    .roof    { stroke: #9a9890; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .ref     { fill: #9a9890; }
    .accent  { fill: #2a78d6; }
    .accent-s{ stroke: #2a78d6; }
    .s0 { fill: #2a78d6; }  .s0-s { stroke: #2a78d6; }
    .s1 { fill: #eb6834; }  .s1-s { stroke: #eb6834; }
    .s2 { fill: #1baf7a; }  .s2-s { stroke: #1baf7a; }
    .s3 { fill: #eda100; }  .s3-s { stroke: #eda100; }
    .s4 { fill: #e87ba4; }  .s4-s { stroke: #e87ba4; }
    .s5 { fill: #008300; }  .s5-s { stroke: #008300; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t-pri   { fill: #ffffff; }
      .t-sec   { fill: #c3c2b7; }
      .t-mut   { fill: #98968c; }
      .grid    { stroke: #2f2f2d; }
      .axis    { stroke: #4a4a46; }
      .roof    { stroke: #7c7a73; }
      .ref     { fill: #7c7a73; }
      .accent  { fill: #3987e5; }
      .accent-s{ stroke: #3987e5; }
      .s0 { fill: #3987e5; }  .s0-s { stroke: #3987e5; }
      .s1 { fill: #d95926; }  .s1-s { stroke: #d95926; }
      .s2 { fill: #199e70; }  .s2-s { stroke: #199e70; }
      .s3 { fill: #c98500; }  .s3-s { stroke: #c98500; }
      .s4 { fill: #d55181; }  .s4-s { stroke: #d55181; }
      .s5 { fill: #008300; }  .s5-s { stroke: #008300; }
    }
  </style>
  <rect class="surface" x="0" y="0" width="720" height="400" rx="6"/>
  <text class="t-pri" x="20" y="26" font-size="15" font-weight="600">Throughput vs matrix size</text>
  <text class="t-sec" x="20" y="44" font-size="12">square FP32 GEMM · GFLOPS · each kernel validated before timing</text>
  <line class="grid" x1="62" y1="354.0" x2="588" y2="354.0"/>
  <text class="t-mut" x="54" y="358.0" font-size="11" text-anchor="end">0</text>
  <line class="grid" x1="62" y1="294.4" x2="588" y2="294.4"/>
  <text class="t-mut" x="54" y="298.4" font-size="11" text-anchor="end">1,000</text>
  <line class="grid" x1="62" y1="234.8" x2="588" y2="234.8"/>
  <text class="t-mut" x="54" y="238.8" font-size="11" text-anchor="end">2,000</text>
  <line class="grid" x1="62" y1="175.2" x2="588" y2="175.2"/>
  <text class="t-mut" x="54" y="179.2" font-size="11" text-anchor="end">3,000</text>
  <line class="grid" x1="62" y1="115.6" x2="588" y2="115.6"/>
  <text class="t-mut" x="54" y="119.6" font-size="11" text-anchor="end">4,000</text>
  <line class="grid" x1="62" y1="56.0" x2="588" y2="56.0"/>
  <text class="t-mut" x="54" y="60.0" font-size="11" text-anchor="end">5,000</text>
  <text class="t-mut" x="62.0" y="372" font-size="11" text-anchor="middle">256</text>
  <text class="t-mut" x="193.5" y="372" font-size="11" text-anchor="middle">512</text>
  <text class="t-mut" x="325.0" y="372" font-size="11" text-anchor="middle">1024</text>
  <text class="t-mut" x="456.5" y="372" font-size="11" text-anchor="middle">2048</text>
  <text class="t-mut" x="588.0" y="372" font-size="11" text-anchor="middle">4096</text>
  <line class="axis" x1="62" y1="354" x2="588" y2="354"/>
  <text class="t-mut" x="325" y="390" font-size="11" text-anchor="middle">matrix size N (N×N×N)</text>
  <path class="s0-s" d="M 62.0 327.9 L 193.5 324.8 L 325.0 327.7 L 456.5 325.6 L 588.0 326.2" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="s0" cx="62.0" cy="327.9" r="4"/>
  <circle class="s0" cx="193.5" cy="324.8" r="4"/>
  <circle class="s0" cx="325.0" cy="327.7" r="4"/>
  <circle class="s0" cx="456.5" cy="325.6" r="4"/>
  <circle class="s0" cx="588.0" cy="326.2" r="4"/>
  <path class="s1-s" d="M 62.0 330.9 L 193.5 328.3 L 325.0 330.8 L 456.5 328.1 L 588.0 328.4" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="s1" cx="62.0" cy="330.9" r="4"/>
  <circle class="s1" cx="193.5" cy="328.3" r="4"/>
  <circle class="s1" cx="325.0" cy="330.8" r="4"/>
  <circle class="s1" cx="456.5" cy="328.1" r="4"/>
  <circle class="s1" cx="588.0" cy="328.4" r="4"/>
  <path class="s2-s" d="M 62.0 329.1 L 193.5 255.5 L 325.0 223.9 L 456.5 218.7 L 588.0 217.8" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="s2" cx="62.0" cy="329.1" r="4"/>
  <circle class="s2" cx="193.5" cy="255.5" r="4"/>
  <circle class="s2" cx="325.0" cy="223.9" r="4"/>
  <circle class="s2" cx="456.5" cy="218.7" r="4"/>
  <circle class="s2" cx="588.0" cy="217.8" r="4"/>
  <path class="s3-s" d="M 62.0 314.6 L 193.5 200.7 L 325.0 108.2 L 456.5 118.5 L 588.0 131.9" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="s3" cx="62.0" cy="314.6" r="4"/>
  <circle class="s3" cx="193.5" cy="200.7" r="4"/>
  <circle class="s3" cx="325.0" cy="108.2" r="4"/>
  <circle class="s3" cx="456.5" cy="118.5" r="4"/>
  <circle class="s3" cx="588.0" cy="131.9" r="4"/>
  <path class="s4-s" d="M 325.0 107.6 L 456.5 88.3 L 588.0 98.4" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="s4" cx="325.0" cy="107.6" r="4"/>
  <circle class="s4" cx="456.5" cy="88.3" r="4"/>
  <circle class="s4" cx="588.0" cy="98.4" r="4"/>
  <path class="s5-s" d="M 62.0 255.7 L 193.5 151.9 L 325.0 98.0 L 456.5 78.8 L 588.0 108.5" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="s5" cx="62.0" cy="255.7" r="4"/>
  <circle class="s5" cx="193.5" cy="151.9" r="4"/>
  <circle class="s5" cx="325.0" cy="98.0" r="4"/>
  <circle class="s5" cx="456.5" cy="78.8" r="4"/>
  <circle class="s5" cx="588.0" cy="108.5" r="4"/>
  <circle class="s4" cx="600" cy="98.4" r="4"/>
  <text class="t-sec" x="610" y="102.4" font-size="11">tuned (BK=16)</text>
  <circle class="s5" cx="600" cy="111.4" r="4"/>
  <text class="t-sec" x="610" y="115.4" font-size="11">cuBLAS</text>
  <circle class="s3" cx="600" cy="131.9" r="4"/>
  <text class="t-sec" x="610" y="135.9" font-size="11">+ float4</text>
  <circle class="s2" cx="600" cy="217.8" r="4"/>
  <text class="t-sec" x="610" y="221.8" font-size="11">register 8x8</text>
  <circle class="s0" cx="600" cy="326.2" r="4"/>
  <text class="t-sec" x="610" y="330.2" font-size="11">naive</text>
  <circle class="s1" cx="600" cy="339.2" r="4"/>
  <text class="t-sec" x="610" y="343.2" font-size="11">shared tiled</text>
